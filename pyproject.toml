[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "algamask"
version = "0.1.0"
description = "Local mock vertical slice for AlgaMask"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
rag = ["sentence-transformers==6.2.0", "faiss-cpu==1.15.1"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]
